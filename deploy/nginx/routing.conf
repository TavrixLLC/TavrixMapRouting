limit_req_zone $binary_remote_addr zone=route_limit:10m rate=250r/s;
limit_req_zone $binary_remote_addr zone=expensive_limit:10m rate=10r/s;
limit_req_status 429;

upstream routing_api {
  server routing-api:3000;
  keepalive 256;
}

server {
  listen 8080;
  server_name _;
  client_max_body_size 512k;
  access_log off;

  location = /health/live {
    proxy_pass http://routing_api/api/routing/health/live;
  }

  location = /health/ready {
    proxy_pass http://routing_api/api/routing/health/ready;
  }

  location ~ ^/api/routing/(route|directions|distance|snap|nearest)(/|$) {
    limit_req zone=route_limit burst=200 nodelay;
    proxy_pass http://routing_api;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header X-Request-ID $request_id;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_connect_timeout 2s;
    proxy_read_timeout 15s;
  }

  location ~ ^/api/routing/(matrix|isochrone|map-match|optimization)(/|$) {
    limit_req zone=expensive_limit burst=10 nodelay;
    proxy_pass http://routing_api;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header X-Request-ID $request_id;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_connect_timeout 2s;
    proxy_read_timeout 20s;
  }

  location / {
    return 404;
  }
}
